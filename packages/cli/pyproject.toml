[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-humanizer-cli"
version = "0.1.0"
description = "Academic Humanizer command line interface"
requires-python = ">=3.9"
dependencies = ["academic-humanizer-engine", "academic-humanizer-api", "typer>=0.12,<1", "rich>=13,<14"]

[project.scripts]
academix = "academic_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
