[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-humanizer-engine"
version = "0.1.0"
description = "Shared local-first academic document services"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-docx>=1.1,<2",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
documents = ["python-docx>=1.1,<2", "PyMuPDF>=1.24,<2"]
providers = ["httpx>=0.27,<1"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]
