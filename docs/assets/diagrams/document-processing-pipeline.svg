<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title">
  <title>Document processing pipeline</title>
  <rect width="1200" height="250" fill="#0C0D0E"/>
  <g font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#E8E8E6" stroke="#3a3f43" stroke-width="1.5">
    <g fill="#141618"><rect x="20" y="90" width="130" height="62" rx="5"/><rect x="175" y="90" width="130" height="62" rx="5"/><rect x="330" y="90" width="130" height="62" rx="5"/><rect x="485" y="90" width="130" height="62" rx="5"/><rect x="640" y="90" width="130" height="62" rx="5"/><rect x="795" y="90" width="130" height="62" rx="5"/><rect x="950" y="90" width="130" height="62" rx="5"/></g>
    <text x="85" y="117">Import</text><text x="85" y="138">DOCX / PDF</text><text x="240" y="117">Parse</text><text x="240" y="138">structure</text><text x="395" y="117">Analyze</text><text x="395" y="138">elements</text><text x="550" y="117">Assemble</text><text x="550" y="138">context</text><text x="705" y="117">Improve</text><text x="705" y="138">paragraph</text><text x="860" y="117">Validate</text><text x="860" y="138">meaning</text><text x="1015" y="117">Review</text><text x="1015" y="138">approve</text>
  </g>
  <path d="M150 121h25m130 0h25m130 0h25m130 0h25m130 0h25m130 0h25" stroke="#E54D2E" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1080 121h90v75H1120" fill="none" stroke="#80A88B" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1080" y="215" fill="#80A88B" font-family="JetBrains Mono,monospace" font-size="12">accepted → revised DOCX</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#E54D2E"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#80A88B"/></marker></defs>
</svg>
