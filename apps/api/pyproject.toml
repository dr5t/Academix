[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-humanizer-api"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["academic-humanizer-engine", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
academix-api = "academic_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
